[package]
name = "iris-nostr"
version = "0.2.0"
target = "host"
description = "Agent-friendly Nostr discovery with social graph filtering"

[package.commands]
iris-nostr = "iris-nostr{exe}"

[build]
commands = [["sh", "scripts/build-release.sh", "{target}"]]
artifacts = { "iris-nostr{exe}" = "target/{target}/release/iris-nostr{exe}" }

[package]
name = "iris-nostr"
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Local-first Nostr event and social graph queries for humans and agents"
default-run = "iris-nostr"
repository = "https://github.com/irislib/iris-nostr"
homepage = "https://github.com/irislib/iris-nostr"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "/README.md", "/LICENSE", "rust-toolchain.toml"]

[lib]
name = "iris_nostr"

[[bin]]
name = "iris-nostr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hashtree-core = "=0.2.91"
hashtree-nostr-pubsub = "=0.2.87"
nostr = "=0.44.7"
nostr-pubsub = "=0.1.19"
nostr-pubsub-relay = "=0.1.15"
nostr-pubsub-social-graph = "=0.2.4"
nostr-social-graph = "=0.1.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

tempfile = "3"

[dev-dependencies]
hashtree-nostr = "=0.2.90"
tokio-tungstenite = "0.26"
futures-util = "0.3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
